name: Mobile browser acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser.yml"
      - "client/**"
      - "src/**"
      - "test/browser/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/browser.yml"
      - "client/**"
      - "src/**"
      - "test/browser/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  chromium-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run production-gateway mobile acceptance
        run: npm run test:browser

      - name: Upload synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-browser-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7
