name: Project checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: project-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: node:22.23.2-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
