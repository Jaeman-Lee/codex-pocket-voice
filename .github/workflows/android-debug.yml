name: Android stable APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-debug.yml"
      - "android/**"
      - "client/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/ReleaseManifestSigner.java"
      - "scripts/create-update-manifest.mjs"
      - "scripts/verify-update-manifest.mjs"
      - "test/update-manifest.test.ts"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-30;aosp_atd;x86_64"

      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: npm run check && npm test

      - name: Read application version
        id: app
        run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build unsigned release APK
        run: npm run android:sync && cd android && ./gradlew assembleRelease

      - name: Test native release policy
        run: cd android && ./gradlew testReleaseUnitTest

      - name: Test Android Keystore, notification intents, and durable native state
        run: cd android && ./gradlew pocketphoneapi30DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload Android instrumentation test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumentation-report-${{ github.run_attempt }}
          path: |
            android/app/build/reports/androidTests/managedDevice/
            android/app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn
          retention-days: 7

      - name: Detect signing configuration
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign APK with the stable project key
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          keystore="$RUNNER_TEMP/codex-pocket-release.jks"
          output="android/app/build/outputs/apk/release/Codex-Pocket-Voice-v${{ steps.app.outputs.version }}-stable.apk"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$output" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$output"

      - name: Prepare unsigned fork artifact
        if: steps.signing.outputs.available == 'false'
        run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk "android/app/build/outputs/apk/release/Codex-Pocket-Voice-v${{ steps.app.outputs.version }}-unsigned.apk"

      - name: Create checksum
        run: cd android/app/build/outputs/apk/release && sha256sum Codex-Pocket-Voice-v*.apk > SHA256SUMS

      - name: Generate dependency SBOM
        run: npm sbom --sbom-format cyclonedx > android/app/build/outputs/apk/release/codex-pocket-sbom.json

      - name: Create and verify signed update manifest
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          release_dir="android/app/build/outputs/apk/release"
          keystore="$RUNNER_TEMP/codex-pocket-release.jks"
          apk="$release_dir/Codex-Pocket-Voice-v${{ steps.app.outputs.version }}-stable.apk"
          certificate="$release_dir/update-manifest-cert.pem"
          manifest="$release_dir/update-manifest.json"
          signature="$release_dir/update-manifest.sig"
          apk_certificates="$RUNNER_TEMP/apk-certificates.txt"
          keytool -exportcert -rfc \
            -keystore "$keystore" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -file "$certificate"
          node scripts/create-update-manifest.mjs \
            --apk "$apk" \
            --sbom "$release_dir/codex-pocket-sbom.json" \
            --output "$manifest" \
            --version "${{ steps.app.outputs.version }}" \
            --version-code "$(node -p "const [a,b,c]='${{ steps.app.outputs.version }}'.split('.').map(Number); a*10000+b*100+c")" \
            --application-id "${POCKET_APPLICATION_ID:-io.github.jaemanlee.codexpocketvoice.stable}" \
            --channel ci \
            --commit "$GITHUB_SHA" \
            --certificate "$certificate"
          mkdir -p "$RUNNER_TEMP/release-manifest-signer"
          javac -d "$RUNNER_TEMP/release-manifest-signer" scripts/ReleaseManifestSigner.java
          java -cp "$RUNNER_TEMP/release-manifest-signer" ReleaseManifestSigner sign "$keystore" "$manifest" "$signature"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "$apk_certificates"
          certificate_sha=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$apk_certificates")
          node -e "if (!/^[a-f0-9]{64}$/i.test(process.argv[1])) process.exit(1)" "$certificate_sha"
          node scripts/verify-update-manifest.mjs \
            --manifest "$manifest" \
            --signature "$signature" \
            --certificate "$certificate" \
            --expected-certificate-sha256 "$certificate_sha" \
            --artifact-dir "$release_dir" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --current-version-code "$(node -p "const [a,b,c]='${{ steps.app.outputs.version }}'.split('.').map(Number); a*10000+b*100+c")" \
            --allow-same-version

      - name: Create unsigned fork update manifest
        if: steps.signing.outputs.available == 'false'
        run: |
          release_dir="android/app/build/outputs/apk/release"
          apk="$release_dir/Codex-Pocket-Voice-v${{ steps.app.outputs.version }}-unsigned.apk"
          manifest="$release_dir/update-manifest.json"
          version_code=$(node -p "const [a,b,c]='${{ steps.app.outputs.version }}'.split('.').map(Number); a*10000+b*100+c")
          node scripts/create-update-manifest.mjs \
            --apk "$apk" \
            --sbom "$release_dir/codex-pocket-sbom.json" \
            --output "$manifest" \
            --version "${{ steps.app.outputs.version }}" \
            --version-code "$version_code" \
            --application-id "${POCKET_APPLICATION_ID:-io.github.jaemanlee.codexpocketvoice.stable}" \
            --channel ci-unsigned \
            --commit "$GITHUB_SHA" \
            --unsigned
          node scripts/verify-update-manifest.mjs \
            --manifest "$manifest" \
            --artifact-dir "$release_dir" \
            --current-version-code "$version_code" \
            --allow-same-version \
            --allow-unsigned

      - name: Package signed update bundle
        if: steps.signing.outputs.available == 'true'
        run: |
          release_dir="android/app/build/outputs/apk/release"
          version="${{ steps.app.outputs.version }}"
          apk="Codex-Pocket-Voice-v${version}-stable.apk"
          bundle="Codex-Pocket-Voice-v${version}-update.zip"
          (
            cd "$release_dir"
            zip -X -j "$bundle" \
              "$apk" \
              codex-pocket-sbom.json \
              SHA256SUMS \
              update-manifest.json \
              update-manifest.sig \
              update-manifest-cert.pem
            mapfile -t entries < <(unzip -Z1 "$bundle")
            test "${#entries[@]}" -eq 6
            printf '%s\n' "${entries[@]}" | sort -u | grep -Fxq "$apk"
            printf '%s\n' "${entries[@]}" | sort -u | grep -Fxq codex-pocket-sbom.json
            printf '%s\n' "${entries[@]}" | sort -u | grep -Fxq SHA256SUMS
            printf '%s\n' "${entries[@]}" | sort -u | grep -Fxq update-manifest.json
            printf '%s\n' "${entries[@]}" | sort -u | grep -Fxq update-manifest.sig
            printf '%s\n' "${entries[@]}" | sort -u | grep -Fxq update-manifest-cert.pem
          )

      - name: Upload APK, signed update bundle, checksum, SBOM, and manifest
        uses: actions/upload-artifact@v7
        with:
          name: Codex-Pocket-Voice-v${{ steps.app.outputs.version }}
          path: |
            android/app/build/outputs/apk/release/Codex-Pocket-Voice-v*.apk
            android/app/build/outputs/apk/release/Codex-Pocket-Voice-v*-update.zip
            android/app/build/outputs/apk/release/SHA256SUMS
            android/app/build/outputs/apk/release/codex-pocket-sbom.json
            android/app/build/outputs/apk/release/update-manifest.json
            android/app/build/outputs/apk/release/update-manifest.sig
            android/app/build/outputs/apk/release/update-manifest-cert.pem
          if-no-files-found: error
          retention-days: 14
