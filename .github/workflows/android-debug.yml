name: Android debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-debug.yml"
      - "android/**"
      - "client/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: npm run check && npm test

      - name: Build unsigned release APK
        run: npm run android:sync && cd android && ./gradlew assembleRelease

      - name: Sign APK with the stable project key
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          keystore="$RUNNER_TEMP/codex-pocket-release.jks"
          output="android/app/build/outputs/apk/release/Codex-Pocket-Voice-v1.3.0-stable.apk"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$output" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$output"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Pocket-Voice-v1.3.0-stable
          path: android/app/build/outputs/apk/release/Codex-Pocket-Voice-v1.3.0-stable.apk
          if-no-files-found: error
          retention-days: 14
