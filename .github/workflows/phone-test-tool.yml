name: Phone test tooling
on:
  pull_request:
    paths:
      - scripts/phone-test.py
      - test/phone-test-tool.test.py
      - .github/workflows/phone-test-tool.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 test/phone-test-tool.test.py
